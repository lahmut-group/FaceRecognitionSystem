name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build JAR
        run: ./mvnw -B package -DskipTests

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload artifacts
        run: |
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SERVER_PORT }} \
            target/operator-panel-0.0.1-SNAPSHOT.jar \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/opencv/project/operator-panel-0.0.1-SNAPSHOT.jar.new
          # Клиент камеры теперь не один файл, а пакет facecore/ рядом с точкой входа.
          # Кладём во временный каталог и переносим одним движением, чтобы работающие
          # процессы не увидели полуобновлённый код.
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'rm -rf /home/opencv/project/OpenCVRework/.incoming && mkdir -p /home/opencv/project/OpenCVRework/.incoming'
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SERVER_PORT }} -r \
            OpenCVRework/face_2.py OpenCVRework/supervisor.py OpenCVRework/facecore \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/opencv/project/OpenCVRework/.incoming/
          scp -i ~/.ssh/deploy_key -P ${{ secrets.SERVER_PORT }} -r \
            deploy/systemd \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/opencv/project/OpenCVRework/.incoming/

      - name: Deploy & restart services
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} bash -s << 'DEPLOY'
          set -e
          cd /home/opencv/project

          # Бэкап текущего jar (храним 3 последних)
          cp operator-panel-0.0.1-SNAPSHOT.jar "operator-panel-0.0.1-SNAPSHOT.jar.bak-$(date +%Y%m%d-%H%M%S)"
          ls -t operator-panel-0.0.1-SNAPSHOT.jar.bak-* 2>/dev/null | tail -n +4 | xargs -r rm --

          mv operator-panel-0.0.1-SNAPSHOT.jar.new operator-panel-0.0.1-SNAPSHOT.jar

          # Код клиента камеры — одним движением
          cd /home/opencv/project/OpenCVRework
          rm -rf facecore
          cp -r .incoming/facecore facecore
          cp .incoming/face_2.py face_2.py
          cp .incoming/supervisor.py supervisor.py
          rm -rf .incoming __pycache__ facecore/__pycache__
          cd /home/opencv/project

          sudo /usr/bin/systemctl restart operator.service
          sleep 8
          systemctl is-active operator.service

          # Камеры: рестарт не критичен для деплоя панели.
          # Супервизор сам поднимет face@<slug> под каждую камеру из реестра.
          sudo /usr/bin/systemctl restart face-supervisor.service || true
          for unit in $(systemctl list-units --type=service --all --no-legend --plain 'face@*.service' | awk '{print $1}'); do
            sudo /usr/bin/systemctl restart "$unit" || true
          done
          sleep 3
          echo "face-supervisor: $(systemctl is-active face-supervisor.service)"
          systemctl list-units --type=service --no-legend --plain 'face@*.service' || true
          DEPLOY

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 10 http://127.0.0.1:8080/login'
