<!-- Фрагмент хедера. Без входа — только логотип и кнопка «Войти» (страницы КПП публичные) -->
<header class="header" th:fragment="header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <div class="header-content">
        <a href="/" class="logo">
            <span class="logo-icon">FP</span>
            <span>FacePanel</span>
        </a>

        <nav class="nav-menu" id="nav-menu" sec:authorize="isAuthenticated()">
            <a href="/dashboard" class="nav-button" data-path="/dashboard">Главная</a>
            <a href="/persons" class="nav-button" data-path="/persons">Персоны</a>
            <a href="/session" class="nav-button" data-path="/session">Мероприятия</a>
            <a href="/attendance" class="nav-button" data-path="/attendance">История</a>
            <a href="/statistics" class="nav-button" data-path="/statistics">Статистика</a>
            <a href="/cameras" class="nav-button" data-path="/cameras">Камеры</a>
            <a href="/kpp" class="nav-button nav-button-kpp" data-path="/kpp">КПП</a>
        </nav>

        <a href="/login" class="nav-button nav-button-login" sec:authorize="!isAuthenticated()">Войти</a>

        <div id="connection-status" class="connection-status disconnected">
            <span>Отключено</span>
        </div>
    </div>

    <script>
        (function() {
            // "/" — та же страница КПП
            var path = window.location.pathname === '/' ? '/kpp' : window.location.pathname;
            var links = document.querySelectorAll('#nav-menu .nav-button');
            links.forEach(function(link) {
                if (path.indexOf(link.getAttribute('data-path')) === 0) {
                    link.classList.add('active');
                }
            });
        })();
    </script>
</header>
